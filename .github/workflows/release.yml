name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: compute version + notes, skip publish"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write   # npm OIDC trusted publishing (provenance)

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11'

jobs:
  release:
    name: Release
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: make install
      - run: make build
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v5
        with:
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
            conventional-changelog-conventionalcommits
        env:
          # npm auth is via OIDC trusted publishing (id-token: write above): publish runs
          # `pnpm publish --provenance` via @semantic-release/exec. NOTE: @semantic-release/npm
          # is intentionally NOT used — its verifyConditions does an npm-token whoami check that
          # OIDC trusted publishing does not satisfy (fails EINVALIDNPMTOKEN). Do not add it back.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Republish the MCP registry manifest after every real release so the
      # registry version never drifts behind npm. server.json was bumped +
      # committed by the prepareCmd/git steps above, so it already holds the
      # released version here. Best-effort: a registry hiccup must not fail the
      # release (npm publish already succeeded inside Semantic Release).
      #
      # Auth: GitHub Actions OIDC works for the `io.github.blueprint-chart/*`
      # namespace (needs `id-token: write`, already granted above). No secret.
      #
      # TODO(one-time): confirm the mcp-publisher download asset name below
      # against https://github.com/modelcontextprotocol/registry/releases.
      # Asset naming can change. Step is continue-on-error so a wrong URL warns
      # instead of breaking the release.
      - name: Publish to MCP registry
        if: ${{ steps.semantic.outputs.new_release_published == 'true' }}
        continue-on-error: true
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
