packages:
  - '.'

# pnpm 11.x supply-chain policy: minimumReleaseAge rejects deps published within 24h.
# We disable it because our own packages (@blueprint-chart/lib, @blueprint-chart/docs)
# are released and consumed immediately from the same monorepo author. Re-evaluate if
# the supply-chain mix changes.
minimumReleaseAge: 0

# pnpm 11.x blocks postinstall scripts by default. esbuild ships a native binary
# postinstall step required by vitest/tsx — approve it explicitly here rather
# than letting CI fail with ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - esbuild
